<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Showtimes Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
        }

        .header-left {
            flex: 1;
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .meta {
            color: #666;
            font-size: 14px;
        }

        .meta span {
            margin-right: 20px;
        }

        .scrape-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scrape-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .scrape-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .scrape-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .filters {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        select, input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 14px;
        }

        button:hover {
            background: #5568d3;
        }

        button.secondary {
            background: #999;
        }

        button.secondary:hover {
            background: #777;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .movies-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .movie-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .movie-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .movie-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .movie-cinema {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .movie-body {
            padding: 20px;
        }

        .movie-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .info-value {
            color: #333;
            font-weight: 600;
        }

        .time-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .date-badge {
            display: inline-block;
            background: #f0f0f0;
            color: #333;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .movie-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background: #f5f5f5;
            color: #667eea;
            text-decoration: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .movie-link:hover {
            background: #667eea;
            color: white;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 10px;
            color: #999;
        }

        .no-results h2 {
            margin-bottom: 10px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 18px;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .movies-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .filters {
                grid-template-columns: 1fr;
            }
        }

        .screen-type-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 3px 8px;
            background: #ffe0b2;
            color: #e65100;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .screen-type-badge.gold {
            background: #fff9c4;
            color: #f57f17;
        }

        .screen-type-badge.vip {
            background: #f0f4c3;
            color: #827717;
        }

        .screen-type-badge.standard {
            background: #e0f2f1;
            color: #004d40;
        }

        .screen-type-badge['4dx'] {
            background: #e3f2fd;
            color: #01579b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>🎬 Cinema Showtimes</h1>
                <div class="meta">
                    <span id="lastUpdated">Loading...</span>
                    <span id="totalCount">Total: 0 showtimes</span>
                </div>
            </div>
            <div class="header-right">
                <button class="scrape-btn" id="scrapeBtn" onclick="scrapeMovies()">
                    <span id="scrapeIcon">🔄</span>
                    <span id="scrapeText">Refresh Data</span>
                </button>
                <button class="scrape-btn" id="downloadBtn" onclick="downloadJSON()" style="background: linear-gradient(135deg, #00bfa5 0%, #00897b 100%);">
                    <span>⬇️</span>
                    <span>Download JSON</span>
                </button>
            </div>
        </header>

        <div class="filters">
            <div class="filter-group">
                <label for="cinemaFilter">Cinema</label>
                <select id="cinemaFilter">
                    <option value="">All Cinemas</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="dateFilter">Date</label>
                <select id="dateFilter">
                    <option value="">All Dates</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="movieFilter">Movie</label>
                <input type="text" id="movieFilter" placeholder="Search movie name...">
            </div>

            <div class="filter-group">
                <label for="timeFilter">Time</label>
                <select id="timeFilter">
                    <option value="">All Times</option>
                    <option value="morning">Morning (06:00-12:00)</option>
                    <option value="afternoon">Afternoon (12:00-18:00)</option>
                    <option value="evening">Evening (18:00-23:59)</option>
                </select>
            </div>

            <div class="button-group" style="grid-column: 1 / -1;">
                <button onclick="filterMovies()">🔍 Filter</button>
                <button class="secondary" onclick="resetFilters()">↺ Reset</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="statTotal">0</div>
                <div class="stat-label">Total Showtimes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statCinemas">0</div>
                <div class="stat-label">Cinemas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statMovies">0</div>
                <div class="stat-label">Unique Movies</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statDates">0</div>
                <div class="stat-label">Days</div>
            </div>
        </div>

        <div id="moviesContainer" class="movies-container">
            <div class="loading">
                <div class="loading-spinner"></div>Loading movies...
            </div>
        </div>
    </div>

    <script>
        let allMovies = [];
        let isScrapingServer = false;

        // Check if server is running
        async function checkServerStatus() {
            try {
                const response = await fetch('/api/status');
                if (response.ok) {
                    return await response.json();
                }
            } catch (error) {
                console.log('Server not running - using static mode');
            }
            return null;
        }

        // Start scraping from server
        async function scrapeMovies() {
            const btn = document.getElementById('scrapeBtn');
            const icon = document.getElementById('scrapeIcon');
            const text = document.getElementById('scrapeText');

            btn.disabled = true;
            icon.className = 'scrape-spinner';
            text.textContent = 'Scraping...';

            try {
                const response = await fetch('/api/scrape');
                const result = await response.json();

                if (result.success) {
                    // Wait a moment for file to write
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    // Reload movies
                    await loadMovies();
                    alert('✅ Data refreshed successfully!');
                } else {
                    alert('❌ Scraping failed: ' + result.message);
                }
            } catch (error) {
                alert('❌ Cannot connect to server. Make sure server is running:\nnpm run server');
                console.error('Scrape error:', error);
            } finally {
                btn.disabled = false;
                icon.className = '';
                icon.textContent = '🔄';
                text.textContent = 'Refresh Data';
            }
        }

        // Load movies.json
        async function loadMovies() {
            try {
                const response = await fetch('movies.json?cache=' + Date.now());
                const data = await response.json();
                allMovies = data.movies;

                // Update metadata
                document.getElementById('lastUpdated').textContent =
                    `Last updated: ${new Date(data.metadata.scrapedAt).toLocaleString()}`;
                document.getElementById('totalCount').textContent =
                    `Total: ${data.metadata.totalMovies} showtimes`;

                // Update stats
                updateStats(allMovies);

                // Populate filters
                populateFilters();

                // Display movies
                displayMovies(allMovies);
            } catch (error) {
                document.getElementById('moviesContainer').innerHTML =
                    `<div class="no-results"><h2>Error loading movies</h2><p>${error.message}</p><p>Run <code>npm run scrape:cheerio</code> first to generate data</p></div>`;
            }
        }

        function updateStats(movies) {
            const uniqueCinemas = new Set(movies.map(m => m.cinema)).size;
            const uniqueMovies = new Set(movies.map(m => m.movie)).size;
            const uniqueDates = new Set(movies.map(m => m.date)).size;

            document.getElementById('statTotal').textContent = movies.length;
            document.getElementById('statCinemas').textContent = uniqueCinemas;
            document.getElementById('statMovies').textContent = uniqueMovies;
            document.getElementById('statDates').textContent = uniqueDates;
        }

        function populateFilters() {
            // Cinema filter
            const cinemas = [...new Set(allMovies.map(m => m.cinema))].sort();
            const cinemaSelect = document.getElementById('cinemaFilter');
            cinemas.forEach(cinema => {
                const option = document.createElement('option');
                option.value = cinema;
                option.textContent = cinema;
                cinemaSelect.appendChild(option);
            });

            // Date filter
            const dates = [...new Set(allMovies.map(m => m.date))].sort();
            const dateSelect = document.getElementById('dateFilter');
            dates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                const dateObj = new Date(date + 'T00:00:00');
                option.textContent = dateObj.toLocaleDateString('en-US', {
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric'
                });
                dateSelect.appendChild(option);
            });
        }

        function getScreenTypeBadge(location) {
            const screenType = location.split(' - ')[1];
            if (!screenType) return '';

            let className = 'standard';
            if (screenType.toUpperCase() === 'GOLD') className = 'gold';
            if (screenType.toUpperCase() === 'VIP') className = 'vip';
            if (screenType.includes('4DX')) className = '4dx';

            return `<span class="screen-type-badge ${className}">${screenType}</span>`;
        }

        function displayMovies(movies) {
            const container = document.getElementById('moviesContainer');

            if (movies.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <h2>No showtimes found</h2>
                        <p>Try adjusting your filters</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = movies.map(movie => `
                <div class="movie-card">
                    <div class="movie-header">
                        <div class="movie-title">${movie.movie}</div>
                        <div class="movie-cinema">${movie.cinema}</div>
                    </div>
                    <div class="movie-body">
                        <div class="movie-info">
                            <div class="info-row">
                                <span class="info-label">📅 Date</span>
                                <span class="date-badge">${new Date(movie.date + 'T00:00:00').toLocaleDateString('en-US', {
                                    weekday: 'short',
                                    month: 'short',
                                    day: 'numeric'
                                })}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">🕐 Time</span>
                                <span class="time-badge">${movie.time}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">📍 Location</span>
                                <span class="info-value">
                                    ${movie.location.split(' - ')[0]}
                                    ${getScreenTypeBadge(movie.location)}
                                </span>
                            </div>
                        </div>
                        <a href="${movie.url}" target="_blank" class="movie-link">View Details →</a>
                    </div>
                </div>
            `).join('');
        }

        function filterMovies() {
            const cinema = document.getElementById('cinemaFilter').value;
            const date = document.getElementById('dateFilter').value;
            const movie = document.getElementById('movieFilter').value.toLowerCase();
            const timeFilter = document.getElementById('timeFilter').value;

            let filtered = allMovies;

            if (cinema) {
                filtered = filtered.filter(m => m.cinema === cinema);
            }

            if (date) {
                filtered = filtered.filter(m => m.date === date);
            }

            if (movie) {
                filtered = filtered.filter(m => m.movie.toLowerCase().includes(movie));
            }

            if (timeFilter) {
                filtered = filtered.filter(m => {
                    const [h, min] = m.time.split(':').map(Number);
                    const timeNum = h * 60 + min;

                    if (timeFilter === 'morning') return timeNum >= 6 * 60 && timeNum < 12 * 60;
                    if (timeFilter === 'afternoon') return timeNum >= 12 * 60 && timeNum < 18 * 60;
                    if (timeFilter === 'evening') return timeNum >= 18 * 60 && timeNum < 24 * 60;
                });
            }

            updateStats(filtered);
            displayMovies(filtered);
        }

        function resetFilters() {
            document.getElementById('cinemaFilter').value = '';
            document.getElementById('dateFilter').value = '';
            document.getElementById('movieFilter').value = '';
            document.getElementById('timeFilter').value = '';
            updateStats(allMovies);
            displayMovies(allMovies);
        }

        // Download filtered movies as JSON
        function downloadJSON() {
            // Get currently displayed movies (filtered or all)
            const cards = document.querySelectorAll('.movie-card');
            const displayedMovies = [];

            if (cards.length === 0 || document.querySelector('.no-results')) {
                alert('No movies to download. Try adjusting your filters.');
                return;
            }

            // Extract data from displayed cards
            cards.forEach(card => {
                const title = card.querySelector('.movie-title').textContent.trim();
                const cinema = card.querySelector('.movie-cinema').textContent.trim();
                const dateText = card.querySelector('.date-badge')?.textContent.trim();
                const timeText = card.querySelector('.time-badge')?.textContent.trim();
                const locationText = card.querySelector('.info-value')?.textContent.trim();

                // Parse date from text like "Sun, May 26"
                let dateStr = '';
                if (dateText) {
                    const dateMatch = dateText.match(/(\w+)\s+(\d+)/);
                    if (dateMatch) {
                        const monthNames = {
                            'Jan': '01', 'Feb': '02', 'Mar': '03', 'Apr': '04',
                            'May': '05', 'Jun': '06', 'Jul': '07', 'Aug': '08',
                            'Sep': '09', 'Oct': '10', 'Nov': '11', 'Dec': '12'
                        };
                        const day = dateMatch[2].padStart(2, '0');
                        const month = monthNames[dateMatch[1]] || '05';
                        dateStr = `2026-${month}-${day}`;
                    }
                }

                displayedMovies.push({
                    movie: title,
                    date: dateStr || new Date().toISOString().split('T')[0],
                    time: timeText || 'Not specified',
                    location: locationText?.split('\n')[0].trim() || 'Not specified',
                    cinema: cinema
                });
            });

            // Create JSON object
            const jsonData = {
                metadata: {
                    exportedAt: new Date().toISOString(),
                    totalMovies: displayedMovies.length,
                    filterApplied: true
                },
                movies: displayedMovies
            };

            // Create blob and download
            const jsonString = JSON.stringify(jsonData, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `cinema-showtimes-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(link);

            // Show confirmation
            alert(`✅ Downloaded ${displayedMovies.length} showtimes as JSON`);
        }

        // Load on page load
        loadMovies();
    </script>
</body>
</html>
